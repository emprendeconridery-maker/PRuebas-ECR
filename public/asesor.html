<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ridery · Panel del asesor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍💼</text></svg>">
<link rel="stylesheet" href="/turnos.css">
<script src="/config.js"></script>
<style>
.caja{max-width:68rem;margin-top:1.1rem}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;justify-content:space-between;margin-bottom:1rem}
.barra h1{margin:0;font-size:1.4rem}
.metricas{display:flex;gap:.5rem;flex-wrap:wrap}
.m{background:#fff;border-radius:.7rem;box-shadow:var(--s2);padding:.5rem .9rem;font-size:.85rem;color:var(--txt-2);display:flex;gap:.5rem;align-items:center}
.m b{font-family:var(--fd);font-size:1.25rem;color:var(--txt)}
.m.esp b{color:var(--azul)} .m.aten b{color:var(--teal-osc)}
.estado-con{display:inline-flex;align-items:center;gap:.45rem;font-size:.82rem;color:var(--teal-osc);font-weight:600}
.estado-con i{width:.5rem;height:.5rem;border-radius:50%;background:var(--teal);animation:lat 1.6s infinite}
.estado-con.off{color:var(--txt-3)} .estado-con.off i{background:#C3CEDE;animation:none}
@keyframes lat{0%,100%{opacity:1}50%{opacity:.3}}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:1rem;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.col h2{display:flex;align-items:center;gap:.5rem;font-size:1.05rem;margin:0 0 .7rem}
.col h2 .n{font:600 .82rem var(--f);background:var(--navy);color:#fff;border-radius:1rem;padding:.08rem .55rem;min-width:1.4rem;text-align:center}
.t{position:relative;background:#fff;border-radius:.75rem;box-shadow:var(--s2);padding:.7rem .85rem;margin-bottom:.55rem;border-left:.28rem solid var(--c);transition:box-shadow .15s,transform .1s}
.t:hover{box-shadow:var(--s3)}
.t.aus{opacity:.72;border-left-style:dashed}
.t.sel{box-shadow:0 0 0 2px var(--navy),var(--s3)}
.fila-t{display:flex;align-items:center;gap:.7rem;cursor:pointer}
.turno-chip{flex:none;min-width:3.1rem;text-align:center;font:700 1.05rem var(--fd);color:#fff;background:var(--c);border-radius:.5rem;padding:.3rem .2rem;line-height:1.1}
.turno-chip small{display:block;font:600 .6rem var(--f);opacity:.85;letter-spacing:.02em}
.info{flex:1;min-width:0}
.info .nom{font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .sub{font-size:.8rem;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.espera-chip{flex:none;font-size:.76rem;font-weight:600;color:var(--txt-2);text-align:right;white-space:nowrap}
.espera-chip.tarde{color:var(--rojo)}
.badges{display:flex;gap:.3rem;margin-top:.25rem;flex-wrap:wrap}
.b{font-size:.68rem;font-weight:600;border-radius:1rem;padding:.08rem .5rem;background:#EEF2F8;color:var(--txt-2)}
.b.aus{background:#FDECEC;color:var(--rojo)}
.btn-llamar{flex:none;font:600 .85rem var(--f);color:#fff;background:var(--azul);border:0;border-radius:.5rem;padding:.5rem .9rem;cursor:pointer;transition:filter .12s,transform .1s}
.btn-llamar:hover{filter:brightness(1.1)} .btn-llamar:active{transform:scale(.97)}
.btn-llamar:disabled{opacity:.6;cursor:wait}
.btn-llamar.re{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.detalle{margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--linea);font-size:.86rem;display:grid;gap:.3rem;animation:subir .2s}
.detalle .d{display:flex;gap:.5rem}.detalle .k{color:var(--txt-2);min-width:6.5rem;flex:none}
.notas{white-space:pre-line;background:var(--lienzo);border-radius:.5rem;padding:.45rem .6rem;font-size:.82rem;margin-top:.3rem}
.acc{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.55rem}
.acc .btn{padding:.42rem .75rem;font-size:.82rem;border-radius:.5rem}
.acc select{width:auto;padding:.42rem .6rem;font-size:.82rem}
.vacio{color:var(--txt-2);text-align:center;padding:2.5rem 1rem;background:#fff;border-radius:.9rem}
.vacio .em{font-size:2rem;display:block;margin-bottom:.4rem}
.llamado{background:linear-gradient(#fff,#fafcff);border-radius:.75rem;box-shadow:var(--s2);padding:.7rem .85rem;margin-bottom:.55rem;border-left:.28rem solid var(--c)}
.llamado.atn{border-left-color:var(--teal-osc)}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(2rem);background:var(--navy);color:#fff;padding:.7rem 1.2rem;border-radius:.7rem;font-weight:600;box-shadow:var(--s4);opacity:0;transition:.25s;z-index:9;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header class="top"><a href="/portal.html" title="Ir al portal"><img src="/logo.png" alt="Ridery"></a><div class="sede">Panel del asesor<b id="hSede">—</b></div></header>
<main class="caja">
  <section class="tarjeta" id="login" style="max-width:30rem;margin:auto">
    <h1>Entrar al panel</h1>
    <label for="lSede">Sede</label><select id="lSede"></select>
    <label for="lPin">PIN de asesor</label><input id="lPin" type="password" inputmode="numeric">
    <p class="error" id="eLogin"></p>
    <button class="btn ancho" id="bEntrar">Entrar</button>
  </section>
  <section class="oculto" id="panel">
    <div class="barra">
      <h1>Conductores en espera</h1>
      <div style="display:flex;gap:.7rem;align-items:center;flex-wrap:wrap">
        <div class="metricas">
          <span class="m esp">En espera <b id="mEsp">0</b></span>
          <span class="m">En atención <b id="mAtn">0</b></span>
          <span class="m aten">Atendidos hoy <b id="mHoy">0</b></span>
        </div>
        <span class="estado-con off" id="con"><i></i><span>Conectando…</span></span>
        <button class="btn sec chico" id="bSalir">Salir</button>
      </div>
    </div>
    <div class="cols">
      <div class="col"><h2>Cola del día <span class="n" id="nEsp">0</span></h2><div id="lEsp"></div></div>
      <div class="col"><h2>Llamados y en atención <span class="n" id="nAt">0</span></h2><div id="lAt"></div></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLOR={S:"var(--azul)",A:"var(--mag)",M:"var(--teal-osc)"},NOM={S:"Soporte",A:"Aspirante",M:"Mant."};
let S=null,datos=null,desfase=0,timer=null,expandido=null,ocupado=false;
$("#lSede").innerHTML=Object.values(SEDES).flat().map(s=>`<option>${s}</option>`).join("");
try{const g=JSON.parse(localStorage.getItem("asesor")||"null");if(g){$("#lSede").value=g.sede}}catch(e){}
const min=ms=>Math.max(0,Math.floor(ms/60000));
const dur=m=>m<1?"recién":m<60?m+" min":Math.floor(m/60)+"h "+String(m%60).padStart(2,"0");
const hora=t=>t?new Date(t).toLocaleTimeString("es-VE",{hour:"numeric",minute:"2-digit"}):"";
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)}
function conexion(ok){const c=$("#con");c.className="estado-con"+(ok?"":" off");c.lastElementChild.textContent=ok?"En vivo":"Reintentando…"}
async function cargar(silencioso){
  if(ocupado&&!silencioso)return;
  try{const d=await api("lista",{pin:S.pin,sede:S.sede});desfase=Date.now()-d.ahora;datos=d;conexion(true);pintar();$("#mHoy").textContent=d.atendidos||0}
  catch(e){if(/PIN|intentos/i.test(e.message)){salir();$("#eLogin").textContent=e.message}else conexion(false)}
}
function tarjetaEspera(t){
  const esperaMin=min(Date.now()-desfase-t.creado),aus=Number(t.ausencias)>0;
  const sub=[t.cola==="M"&&t.placa?esc(t.placa):"",t.motivo?esc(t.motivo):NOM[t.cola]].filter(Boolean).join(" · ");
  return `<article class="t${aus?" aus":""}${expandido===t.id?" sel":""}" style="--c:${COLOR[t.cola]}" data-id="${t.id}">
    <div class="fila-t" data-exp="${t.id}">
      <div class="turno-chip" style="--c:${COLOR[t.cola]}">${esc(t.turno)}<small>${NOM[t.cola].toUpperCase()}</small></div>
      <div class="info"><div class="nom">${esc(t.nombre)}</div><div class="sub">${sub}</div>${aus?`<div class="badges"><span class="b aus">No se presentó (${t.ausencias})</span></div>`:""}</div>
      <div class="espera-chip${esperaMin>=30?" tarde":""}">${dur(esperaMin)}</div>
      <button class="btn-llamar" data-a="llamar" data-id="${t.id}">Llamar</button>
    </div>${expandido===t.id?detalle(t,false):""}</article>`;
}
function tarjetaLlamado(t){
  const atn=t.estado==="en atencion";
  return `<article class="llamado${atn?" atn":""}" style="--c:${COLOR[t.cola]}" data-id="${t.id}">
    <div class="fila-t" data-exp="${t.id}">
      <div class="turno-chip" style="--c:${COLOR[t.cola]}">${esc(t.turno)}<small>${NOM[t.cola].toUpperCase()}</small></div>
      <div class="info"><div class="nom">${esc(t.nombre)}</div><div class="sub">${atn?"En atención":"Llamado "+hora(t.llamado)+(t.llamadas>1?" ("+t.llamadas+"×)":"")}</div></div>
      ${!atn?`<button class="btn-llamar re" data-a="llamar" data-id="${t.id}">Rellamar</button>`:""}
    </div>${expandido===t.id?detalle(t,true):""}</article>`;
}
function detalle(t,llamado){
  const d=(k,v)=>v?`<div class="d"><span class="k">${k}</span><span>${esc(v)}</span></div>`:"";
  const otras=Object.keys(COLAS).filter(k=>k!==t.cola).map(k=>`<option value="${k}">${COLAS[k]}</option>`).join("");
  return `<div class="detalle">
    ${d("Cédula",t.cedula)}${d("Teléfono",t.telefono)}${t.cola==="S"?d("ID de conductor",t.id_conductor||"— no indicado —"):""}${d("Placa",t.placa)}${d("Motivo",t.motivo)}${d("N° de reporte",t.reporte)}${d("Detalle",t.detalle)}${t.derivado_de?d("Derivado de",t.derivado_de):""}
    ${t.notas?`<div class="notas">${esc(t.notas)}</div>`:""}
    <div class="acc">
      <button class="btn azul" data-a="llamar" data-id="${t.id}">${llamado?"Rellamar":"Llamar conductor"}</button>
      ${t.estado==="llamado"?`<button class="btn verde" data-a="primera" data-id="${t.id}">Primera atención</button><button class="btn sec" data-a="ausente" data-id="${t.id}">No se presentó</button>`:""}
      <button class="btn" data-a="finalizar" data-id="${t.id}">Finalizar</button>
      <select data-derivar data-id="${t.id}"><option value="">Derivar a…</option>${otras}</select>
      <button class="btn sec" data-a="nota" data-id="${t.id}">+ Nota</button>
    </div></div>`;
}
function pintar(){
  const esp=datos.turnos.filter(t=>t.estado==="en espera"),at=datos.turnos.filter(t=>t.estado!=="en espera");
  $("#mEsp").textContent=esp.length;$("#mAtn").textContent=at.length;$("#nEsp").textContent=esp.length;$("#nAt").textContent=at.length;
  $("#lEsp").innerHTML=esp.map(tarjetaEspera).join("")||`<div class="vacio"><span class="em">☕</span>Nadie en espera por ahora</div>`;
  $("#lAt").innerHTML=at.map(tarjetaLlamado).join("")||`<div class="vacio"><span class="em">📣</span>Aún no has llamado a nadie</div>`;
}
document.addEventListener("click",e=>{
  const exp=e.target.closest("[data-exp]");
  if(exp&&!e.target.closest("[data-a],[data-derivar],.btn-llamar")){const id=exp.dataset.exp;expandido=expandido===id?null:id;pintar();return}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;e.stopPropagation();
  const id=b.dataset.id,acc=b.dataset.a,extra={};
  if(acc==="nota"){const t=prompt("Nota para este conductor:");if(!t)return;extra.texto=t;extra.autor="Asesor"}
  if(acc==="finalizar"&&!confirm("¿Finalizar la atención?"))return;
  const prev=b.textContent;b.disabled=true;if(acc==="llamar")b.textContent="Llamando…";ocupado=true;
  if(acc==="llamar"){const t=datos.turnos.find(x=>x.id===id);if(t)toast("📣 Llamando a "+String(t.nombre).split(" ")[0]+" · "+t.turno)}
  try{const r=await api(acc,Object.assign({pin:S.pin,sede:S.sede,id},extra));
    if(acc==="finalizar"&&r.turno)toast("✓ "+r.turno.turno+" finalizado");
    ocupado=false;await cargar(true)}
  catch(err){ocupado=false;b.disabled=false;b.textContent=prev;toast("⚠ "+err.message)}
});
document.addEventListener("change",async e=>{
  const s=e.target.closest("[data-derivar]");if(!s||!s.value)return;const id=s.dataset.id;
  const motivo=prompt("¿Por qué lo derivas a "+COLAS[s.value]+"? (se lo pasamos al otro asesor)");
  if(motivo===null){s.value="";return}
  ocupado=true;try{await api("derivar",{pin:S.pin,sede:S.sede,id,cola:s.value,motivo});toast("→ Derivado a "+COLAS[s.value]);ocupado=false;await cargar(true)}catch(err){ocupado=false;toast("⚠ "+err.message)}
});
$("#bEntrar").onclick=async()=>{
  S={sede:$("#lSede").value,pin:$("#lPin").value.trim()};$("#eLogin").textContent="";
  try{localStorage.setItem("asesor",JSON.stringify({sede:S.sede}))}catch(e){}
  $("#hSede").textContent=S.sede;$("#login").classList.add("oculto");$("#panel").classList.remove("oculto");
  await cargar();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)cargar(true)},5000);
};
function salir(){clearInterval(timer);$("#panel").classList.add("oculto");$("#login").classList.remove("oculto")}
$("#bSalir").onclick=salir;
$("#lPin").addEventListener("keydown",e=>{if(e.key==="Enter")$("#bEntrar").click()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S)cargar(true)});
</script>
</body>
</html>
