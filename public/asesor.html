<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ridery · Panel del asesor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍💼</text></svg>">
<link rel="stylesheet" href="/turnos.css">
<script src="/config.js"></script>
<style>
.caja{max-width:72rem}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;justify-content:space-between;margin-bottom:1rem}
.barra h1{margin:0}
.quien{color:var(--txt-2);font-size:.95rem}.quien b{color:var(--txt)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.col h2{display:flex;align-items:center;gap:.5rem}
.n{font:600 .85rem var(--f);background:var(--navy);color:#fff;border-radius:1rem;padding:.1rem .55rem}
.t{background:#fff;border-radius:.9rem;box-shadow:var(--sombra);padding:1rem 1.1rem;margin-bottom:.8rem;border-left:.3rem solid var(--c,var(--navy))}
.t.tarde{border-left-color:var(--rojo);background:#FFF6F5}
.cab{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
.num{font:700 1.6rem/1 var(--fd)}
.espera{margin-left:auto;font-weight:600;font-size:.9rem;color:var(--txt-2)}.tarde .espera{color:var(--rojo)}
.dat{font-size:.9rem;margin:.5rem 0;display:grid;gap:.15rem}
.dat .k{color:var(--txt-2)}
.notas{white-space:pre-line;font-size:.85rem;background:var(--lienzo);border-radius:.5rem;padding:.5rem .7rem;margin:.4rem 0}
.acc{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.6rem}
.acc select{width:auto;padding:.45rem .6rem;font-size:.88rem}
.vacio{color:var(--txt-2);text-align:center;padding:2rem 1rem;background:#fff;border-radius:.9rem}
#modal{position:fixed;inset:0;background:rgba(21,43,73,.45);display:grid;place-items:center;padding:1rem;z-index:5}
#modal .tarjeta{max-width:26rem;width:100%}
</style>
</head>
<body>
<header class="top"><a href="/portal.html" title="Ir al portal"><img src="/logo.png" alt="Ridery"></a><div class="sede">Panel del asesor<b id="hSede">—</b></div></header>
<main class="caja">
  <section class="tarjeta" id="login" style="max-width:30rem;margin:auto">
    <h1>Entrar al panel</h1>
    <label for="lSede">Sede</label><select id="lSede"></select>
    <label for="lCola">Área que atiendes</label>
    <select id="lCola"><option value="S">Soporte (S)</option><option value="A">Aspirantes (A)</option><option value="M">Mantenimiento y siniestros (M)</option></select>
    <label for="lPin">PIN de asesor</label><input id="lPin" type="password" inputmode="numeric">
    <p class="error" id="eLogin"></p>
    <button class="btn ancho" id="bEntrar">Entrar</button>
  </section>

  <section class="oculto" id="panel">
    <div class="barra">
      <div><h1 id="pTitulo">—</h1><div class="quien" id="pQuien"></div></div>
      <div style="display:flex;gap:.5rem;align-items:center"><span class="pill" id="pAct">—</span><button class="btn sec chico" id="bSalir">Cambiar área</button></div>
    </div>
    <div class="cols">
      <div class="col"><h2>En espera <span class="n" id="nEsp">0</span></h2><div id="lEsp"></div></div>
      <div class="col"><h2>Llamados y en atención <span class="n" id="nAt">0</span></h2><div id="lAt"></div></div>
    </div>
  </section>
</main>
<div id="modal" class="oculto"><div class="tarjeta"><h2 id="mTit">Atención finalizada</h2><p class="sub" id="mTxt"></p>
  <a class="btn wa ancho" id="mWa" target="_blank" rel="noopener">Enviar encuesta también por WhatsApp</a>
  <button class="btn sec ancho" id="mCerrar" style="margin-top:.6rem">Cerrar</button></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLOR={S:"var(--azul)",A:"var(--mag)",M:"var(--teal-osc)"};
let S=null,datos=null,desfase=0,timer=null;
$("#lSede").innerHTML=Object.values(SEDES).flat().map(s=>`<option>${s}</option>`).join("");
try{const g=JSON.parse(localStorage.getItem("asesor")||"null");if(g){$("#lSede").value=g.sede;$("#lCola").value=g.cola}}catch(e){}

const min=ms=>Math.max(0,Math.floor(ms/60000));
const dur=m=>m<60?m+" min":Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")+" min";
const hora=t=>t?new Date(t).toLocaleTimeString("es-VE",{hour:"numeric",minute:"2-digit"}):"";

async function cargar(){
  // no redibujar mientras el asesor usa "Derivar a..." (se le cerraria la lista)
  if(document.activeElement&&document.activeElement.matches("select[data-derivar]"))return;
  try{datos=await api("lista",{pin:S.pin,sede:S.sede});desfase=Date.now()-datos.ahora;pintar();$("#pAct").textContent="Actualizado "+hora(Date.now())}
  catch(e){if(/PIN|intentos/i.test(e.message)){salir();$("#eLogin").textContent=e.message;}else $("#pAct").textContent="Sin conexión, reintentando…"}
}
function tarjeta(t){
  const esperaMin=min(Date.now()-desfase-t.creado),tarde=t.estado==="en espera"&&esperaMin>=30;
  const fila=(k,v)=>v?`<div><span class="k">${k}:</span> ${esc(v)}</div>`:"";
  const otras=Object.keys(COLAS).filter(k=>k!==S.cola).map(k=>`<option value="${k}">${COLAS[k]}</option>`).join("");
  return `<article class="t${tarde?" tarde":""}" style="--c:${COLOR[t.cola]}" data-id="${t.id}">
    <div class="cab"><span class="num">${esc(t.turno)}</span><b>${esc(t.nombre)}</b>${t.derivado_de?`<span class="pill">Derivado de ${esc(t.derivado_de)}</span>`:""}
      <span class="espera">${t.estado==="en espera"?"Espera "+dur(esperaMin):t.estado==="llamado"?"Llamado "+hora(t.llamado)+(t.llamadas>1?" ("+t.llamadas+"×)":""):"En atención"}</span></div>
    <div class="dat">${fila("Cédula",t.cedula)}${fila("Teléfono",t.telefono)}${fila("Placa",t.placa)}${fila("Motivo",t.motivo)}${fila("N° de reporte",t.reporte)}${fila("Detalle",t.detalle)}</div>
    ${t.notas?`<div class="notas">${esc(t.notas)}</div>`:""}
    <div class="acc">
      <button class="btn azul chico" data-a="llamar">${t.llamado?"Volver a llamar":"Llamar conductor"}</button>
      ${t.estado!=="en atencion"?`<button class="btn verde chico" data-a="primera">Primera atención realizada</button>`:""}
      <button class="btn chico" data-a="finalizar">Finalizar</button>
      <select data-derivar><option value="">Derivar a…</option>${otras}</select>
      <button class="btn sec chico" data-a="nota">+ Nota</button>
    </div></article>`;
}
function pintar(){
  const a=datos.asesores[S.cola]||{};
  $("#pQuien").innerHTML=a.nombre?`Atiende: <b>${esc(a.nombre)}</b>${a.puesto?" · Puesto "+esc(a.puesto):""} · Atendidos hoy: ${(datos.atendidos||{})[S.cola]||0}`:`<span style="color:var(--rojo)">El coordinador aún no asignó quién atiende esta área.</span>`;
  const mios=datos.turnos.filter(t=>t.cola===S.cola);
  const esp=mios.filter(t=>t.estado==="en espera").sort((x,y)=>x.creado-y.creado),at=mios.filter(t=>t.estado!=="en espera").sort((x,y)=>(y.llamado||0)-(x.llamado||0));
  $("#nEsp").textContent=esp.length;$("#nAt").textContent=at.length;
  $("#lEsp").innerHTML=esp.map(tarjeta).join("")||`<div class="vacio">Nadie en espera</div>`;
  $("#lAt").innerHTML=at.map(tarjeta).join("")||`<div class="vacio">Nadie llamado</div>`;
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const id=b.closest("[data-id]").dataset.id,acc=b.dataset.a,extra={};
  if(acc==="nota"){const t=prompt("Nota para este conductor (ej. también tiene un problema con la app):");if(!t)return;extra.texto=t;extra.autor=(datos.asesores[S.cola]||{}).nombre||COLAS[S.cola]}
  if(acc==="finalizar"&&!confirm("¿Finalizar la atención de este conductor?"))return;
  b.disabled=true;try{const r=await api(acc,Object.assign({pin:S.pin,sede:S.sede,id},extra));if(acc==="finalizar")avisoFinal(r.turno);await cargar()}catch(err){alert(err.message);b.disabled=false}
});
document.addEventListener("change",async e=>{
  const s=e.target.closest("[data-derivar]");if(!s||!s.value)return;const id=s.closest("[data-id]").dataset.id;
  if(!confirm("¿Derivar a "+COLAS[s.value]+"?")){s.value="";return}
  try{await api("derivar",{pin:S.pin,sede:S.sede,id,cola:s.value});await cargar()}catch(err){alert(err.message)}
});
$("#bEntrar").onclick=async()=>{
  S={sede:$("#lSede").value,cola:$("#lCola").value,pin:$("#lPin").value.trim()};$("#eLogin").textContent="";
  try{localStorage.setItem("asesor",JSON.stringify({sede:S.sede,cola:S.cola}))}catch(e){}
  $("#hSede").textContent=S.sede;$("#pTitulo").textContent=COLAS[S.cola];$("#login").classList.add("oculto");$("#panel").classList.remove("oculto");
  await cargar();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)cargar()},10000);
};
function avisoFinal(t){
  const tel=String(t.telefono||"").replace(/\D/g,"").replace(/^0/,"58"),link=location.origin+"/encuesta.html?t="+t.id+"&k="+t.token;
  const m=t.cola==="M"&&t.placa;$("#mTxt").textContent=m?"La encuesta le llegará por correo automáticamente cuando el vehículo "+t.placa+" salga del taller.":"La encuesta ya se envió al correo del conductor.";
  $("#mWa").classList.toggle("oculto",!!m||tel.length<11);
  $("#mWa").href="https://wa.me/"+tel+"?text="+encodeURIComponent(`Hola ${String(t.nombre).split(" ")[0]}, gracias por visitarnos en Ridery. ¿Nos ayudas calificando tu atención (turno ${t.turno})? ${link}`);
  $("#modal").classList.remove("oculto")}
$("#mCerrar").onclick=()=>$("#modal").classList.add("oculto");
function salir(){clearInterval(timer);$("#panel").classList.add("oculto");$("#login").classList.remove("oculto")}
$("#bSalir").onclick=salir;
$("#lPin").addEventListener("keydown",e=>{if(e.key==="Enter")$("#bEntrar").click()});
</script>
</body>
</html>
